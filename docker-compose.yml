# Breeze -- the whole app, from one `.env`.
#
#   ./setup.sh            first run: preflight, secrets, build, up
#   docker compose up -d  afterwards
#
# Ollama is deliberately *not* a service here. It stays on the host so it keeps
# your GPU without nvidia-container-toolkit, and so the ~25 GB of weights you
# have already pulled are reused rather than re-downloaded into a volume.
# `host.docker.internal` below is what the containers dial to reach it.
#
# Each service reads the *same* root .env; the `environment:` blocks translate
# the shared names into the ones each service actually expects (BREEZE_API_KEY
# becomes OLLAMA_API_KEY for Next and API_KEY for FastAPI). That indirection is
# the reason there is one env file instead of two.

name: breeze

x-host-ollama: &host-ollama
  # Maps host.docker.internal to the host gateway. macOS and Windows resolve it
  # natively; Linux does not, and this line is what makes the compose file
  # portable across all three.
  extra_hosts:
    - 'host.docker.internal:host-gateway'

services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      # Loopback only -- reachable from mongosh/Compass on this machine, not
      # from the network.
      - '127.0.0.1:${MONGO_HOST_PORT:-27017}:27017'
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    <<: *host-ollama
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - '127.0.0.1:8000:8000'
    environment:
      API_KEY: ${BREEZE_API_KEY:?set BREEZE_API_KEY in .env}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
      UI_MODEL_BASE_URL: ${UI_MODEL_BASE_URL:-}
      UI_MODEL_API_KEY: ${UI_MODEL_API_KEY:-ollama}
      UI_MODEL_NAME: ${UI_MODEL_NAME:-}
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=3).status==200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  frontend:
    <<: *host-ollama
    build:
      context: .
    restart: unless-stopped
    ports:
      - '${APP_PORT:-3000}:3000'
    environment:
      # Service name, not localhost -- inside the network `backend` resolves to
      # the FastAPI container.
      OLLAMA_API_URL: http://backend:8000
      OLLAMA_API_KEY: ${BREEZE_API_KEY:?set BREEZE_API_KEY in .env}
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/breeze}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in .env}
      # Browser-facing, so this one is localhost even though the service is not.
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      PLATFORM_PASSWORD: ${PLATFORM_PASSWORD:?set PLATFORM_PASSWORD in .env}
    depends_on:
      backend:
        condition: service_healthy
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
